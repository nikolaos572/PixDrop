name: Build and Export Docker Image

on:
  workflow_dispatch:

# Add this global environment variable to silence the warning
# and force the runner to use Node 24 for the actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t pixdrop:latest .

      - name: Save and compress Docker image
        run: docker save pixdrop:latest | gzip > pixdrop.tar.gz

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-image
          path: pixdrop.tar.gz
          retention-days: 1
          compression-level: 0 # already gzipped
